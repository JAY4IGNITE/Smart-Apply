services:
  - type: web
    name: smartapply-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.0"
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: smartapply-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: NVIDIA_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: smartapplyai1@gmail.com
      - key: BREVO_SENDER_NAME
        value: SmartApply
      - key: FRONTEND_URL
        value: https://smartapplies.app

  - type: web
    name: smartapply-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_CORE_API_BASE_URL
        fromService:
          type: web
          name: smartapply-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_AI_API_BASE_URL
        fromService:
          type: web
          name: smartapply-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_TOOLS_API_BASE_URL
        fromService:
          type: web
          name: smartapply-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: smartapply-backend
          envVarKey: RENDER_EXTERNAL_URL

  - type: redis
    name: smartapply-redis
    ipAllowList: [] # Internal only
    plan: free
